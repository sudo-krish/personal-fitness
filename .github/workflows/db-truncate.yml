name: Manual DB Truncate & Load

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'D1 Target environment'
        required: true
        default: 'remote'
        type: choice
        options:
          - remote
          - local
      confirm:
        description: 'Type "truncate-and-load" to confirm wipe'
        required: true
        type: string

permissions:
  contents: read

jobs:
  truncate-and-load:
    name: Truncate & Load Exercises DB
    runs-on: ubuntu-latest
    if: inputs.confirm == 'truncate-and-load'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Truncate & Load against D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.target }}" = "remote" ]; then
            npm run db:truncate:remote
          else
            npm run db:truncate:local
          fi
