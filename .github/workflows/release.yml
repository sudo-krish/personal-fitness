name: Release Pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      override_level:
        description: 'Manual release level override'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  release:
    name: Build, Version, and Release
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python for detect-secrets
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          elif [ -f "package.json" ]; then
            npm install
          fi
          if [ -f ".makelib/package.json" ] && [ ! -d ".makelib/node_modules" ]; then
            npm --prefix .makelib install
          fi

      - name: Run 8-Stage Quality Gate Pipeline
        run: make check-all
        env:
          MIN_COVERAGE: 80

      - name: Compile Production Bundle
        run: make build

      - name: Calculate Next Version
        id: semver
        run: |
          OVERRIDE="${{ github.event.inputs.override_level || '' }}"
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref || '' }}"
          if [ -n "$OVERRIDE" ] && [ "$OVERRIDE" != "auto" ]; then
            NEW_VER=$(bash scripts/semver-release.sh --next-version --level "$OVERRIDE")
          elif [ -n "$SOURCE_BRANCH" ]; then
            NEW_VER=$(bash scripts/semver-release.sh --next-version --branch "$SOURCE_BRANCH")
          else
            NEW_VER=$(bash scripts/semver-release.sh --next-version)
          fi
          echo "version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "Calculated unique next version: v$NEW_VER"

      - name: Tag Release
        run: |
          NEW_VERSION="${{ steps.semver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Sync local workspace version for artifacts and npm registry metadata
          bash scripts/semver-release.sh --apply "${NEW_VERSION}"
          # Tag the release commit and push the tag only
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          echo "Pushing release tag v${NEW_VERSION} to origin..."
          git push origin "v${NEW_VERSION}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.semver.outputs.version }}"
          ASSETS=()
          if [ -d "dist" ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            ASSETS=(dist/*)
          fi
          gh release create "v${NEW_VERSION}" "${ASSETS[@]}" \
            --title "Release v${NEW_VERSION}" \
            --generate-notes

  deploy:
    name: Deploy to Cloudflare Pages
    needs: release
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          elif [ -f "package.json" ]; then
            npm install
          fi
          if [ -f ".makelib/package.json" ] && [ ! -d ".makelib/node_modules" ]; then
            npm --prefix .makelib install
          fi

      - name: Provision D1 Database & Run Migrations (Makefile db-setup)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Running make db-setup..."
            make db-setup
          else
            echo "CLOUDFLARE_API_TOKEN not set; skipping db-setup."
          fi

      - name: Deploy to Cloudflare Pages (Makefile deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Deploying application via make deploy..."
            make deploy
          else
            echo "CLOUDFLARE_API_TOKEN secret not configured; skipping Cloudflare Pages deployment."
          fi
