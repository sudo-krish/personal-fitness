<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="azureGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="100%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Background squircle with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Partner Strength Geometric Lines -->
  <!-- Left Wing (Krish - Azure) -->
  <path
    d="M 16 43 L 26 21 C 27 19, 29 19, 30 21 L 32 26 L 24 43 C 23.2 44.5, 21.5 45.2, 19.8 44.7 Z"
    fill="url(#azureGrad)"
  />

  <!-- Right Wing (Theju - Rose) -->
  <path
    d="M 48 43 L 38 21 C 37 19, 35 19, 34 21 L 32 26 L 40 43 C 40.8 44.5, 42.5 45.2, 44.2 44.7 Z"
    fill="url(#roseGrad)"
  />

  <!-- Central Strength Apex Diamond / Core -->
  <polygon
    points="32,15 36.5,23 32,29 27.5,23"
    fill="url(#glowGrad)"
  />

  <!-- Subtle Bottom Synergy Dot -->
  <circle cx="32" cy="46" r="2.5" fill="#38BDF8" opacity="0.8" />
</svg>
